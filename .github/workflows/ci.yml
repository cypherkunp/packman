name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck and test
        run: npm run check

      - name: Package VSIX
        run: npx vsce package --out packman.vsix

      - uses: actions/upload-artifact@v7
        with:
          name: packman-vsix
          path: packman.vsix
          retention-days: 7
