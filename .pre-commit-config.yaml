# Git hooks, run by the pre-commit tool. Install once per clone:
#   pip install pre-commit    (or: brew install pre-commit)
#   pre-commit install
#
# The version bump runs at the post-commit stage: it reads the message of the
# commit just made, then amends that commit to include the bumped version.
# See scripts/bump-version.mjs.
default_install_hook_types: [post-commit]
repos:
  - repo: local
    hooks:
      - id: conventional-version-bump
        name: bump app version from conventional commit
        entry: node scripts/bump-version.mjs
        language: system
        stages: [post-commit]
        pass_filenames: false
        always_run: true
